<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Saúde- Pagina inicial</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        /* =========================
           RESET
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
        }

        /* =========================
           HEADER
        ========================== */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #30895f;
            flex-wrap: wrap;
            gap: 20px;
        }

        .titulo {
            color: #f2f2f2;
        }

        .titulo h1 {
            font-size: 36px;
        }

        .titulo h3 {
            margin-top: 5px;
            font-weight: normal;
        }

        /* =========================
           BOTÕES
        ========================== */

        .acoes button,
        .acoes_2 {
            padding: 20px 150px;
            border: none;
            background-color: #30895f;
            color: white;
            cursor: pointer;
            border-radius: 8px;
            font-size: 16px;
            transition: 0.3s;
        }

        .acoes button:hover,
        .acoes_2:hover {
            background-color: #256b4a;
        }

        /* =========================
           PRINCIPAL
        ========================== */

        .principal {
            padding: 40px;
            text-align: center;
        }

        .principal p {
            font-size: 20px;
            color: #333;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        footer {
            background-color: #30895f;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        /* =========================
           ESPECIALIDADES
        ========================== */

        .especialidades {
            padding: 20px 40px;
            text-align: center;
        }

        .especialidades p {
            font-size: 28px;
            font-weight: bold;
            color: #30895f;
            margin-bottom: 20px;
        }

        .especialidades-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .especialidades button {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            padding: 15px 20px;

            border: none;
            border-radius: 12px;

            background-color: white;
            color: #333;

            cursor: pointer;
            transition: 0.3s;

            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .especialidades button:hover {
            background-color: #30895f;
            color: white;
            transform: translateY(-3px);
        }

        .especialidades button span {
            font-size: 18px;
            font-weight: bold;
        }

        /* =========================
           CARROSSEL
        ========================== */

        .carrossel {
            position: relative;
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .carrossel img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 15px;
        }

        .prev,
        .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);

            background-color: rgba(0,0,0,0.5);
            color: white;

            border: none;
            padding: 12px 16px;

            cursor: pointer;
            font-size: 22px;

            border-radius: 50%;
            transition: 0.3s;
        }

        .prev {
            left: 15px;
        }

        .next {
            right: 15px;
        }

        .prev:hover,
        .next:hover {
            background-color: rgba(0,0,0,0.8);
        }

        /* =========================
           CONTATOS
        ========================== */

        .contatos {
            padding: 40px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .contatos button {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;

            width: 250px;

            padding: 20px;

            border: none;
            border-radius: 12px;

            background-color: white;
            color: #333;

            cursor: pointer;
            transition: 0.3s;

            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .contatos button:hover {
            background-color: #30895f;
            color: white;
            transform: translateY(-3px);
        }

        .contatos h4 {
            font-size: 18px;
        }

        .contatos i {
            font-size: 28px;
        }

        /* =========================
           RESPONSIVIDADE
        ========================== */

        @media (max-width: 768px) {

            header {
                flex-direction: column;
                text-align: center;
            }

            .titulo h1 {
                font-size: 28px;
            }

            .especialidades-container {
                flex-direction: column;
                align-items: center;
            }

            .especialidades button,
            .contatos button {
                width: 100%;
                max-width: 350px;
                justify-content: center;
            }

            .carrossel img {
                height: 250px;
            }

            .principal {
                padding: 20px;
            }
        }

    </style>
</head>

    <body>

        <!-- HEADER -->

        <header>

            <div class="titulo">
                <h1>Click Saúde</h1>
                <h3>Cuidando da sua saúde com excelência</h3>
            </div>

            <div class="acoes">
                <button onclick="window.location.href='LOGIN.html'">
                    Entrar
                </button>
            </div>

        </header>

        <!-- CARROSSEL -->

        <div class="carrossel">

            <button class="prev"
            onclick="mudarSlide(-1)"
            aria-label="Imagem anterior">
                ❮
            </button>

            <img id="imagem-carrossel"
            src="https://images.unsplash.com/photo-1584515933487-779824d29309?q=80&w=1200&auto=format&fit=crop"
            alt="Imagem da clínica">

            <button class="next"
            onclick="mudarSlide(1)"
            aria-label="Próxima imagem">
                ❯
            </button>

        </div>

        <!-- PRINCIPAL -->

        <div class="principal">

            <p>
                Atendimento de qualidade com profissionais especializados.<br>
                Agende sua consulta de forma rápida e segura.
            </p>

            <button class="acoes_2" onclick="window.location.href='Agendamento.html'">
                Agendar agora
            </button>

        </div>

        <!-- ESPECIALIDADES -->

        <div class="especialidades">

            <p>Conheça mais sobre as nossas especialidades</p>

            <div class="especialidades-container">

        
                <button onclick="window.location.href='Clinico-Geral.html'">
                    <i class="fa-solid fa-stethoscope"></i>
                    <span>Clínico Geral</span>
                </button>

                <button onclick="window.location.href='Cardiologia.html'">
                    <i class="fa-solid fa-heart-pulse"></i>
                    <span>Cardiologia</span>
                </button>

                <button onclick="window.location.href='Neurologia.html'">
                    <i class="fa-solid fa-brain"></i>
                    <span>Neurologia</span>
                </button>

                <button onclick="window.location.href='Oftalmologia.html'">
                    <i class="fa-solid fa-eye"></i>
                    <span>Oftalmologia</span>
                </button>

            </div>

        </div>

        <!-- CONTATOS -->

        <div class="contatos">

            <button>
                <i class="fa-solid fa-phone"></i>
                <h4>Telefone</h4>
                <span>(11) 3000-0000</span>
            </button>

            <button>
                <i class="fa-solid fa-location-dot"></i>
                <h4>Endereço</h4>
                <span>Av. Paulista, 1000 - SP</span>
            </button>

            <button>
                <i class="fa-solid fa-clock"></i>
                <h4>Horário</h4>
                <span>Seg-Sex: 7h às 20h</span>
            </button>

        </div>

        <!-- JAVASCRIPT -->

        <script>

            const imagens = [

                "https://images.unsplash.com/photo-1584515933487-779824d29309?q=80&w=1200&auto=format&fit=crop",

                "https://images.unsplash.com/photo-1576091160550-2173dba999ef?q=80&w=1200&auto=format&fit=crop",

                "https://images.unsplash.com/photo-1582750433449-648ed127bb54?q=80&w=1200&auto=format&fit=crop"

            ];

            let indice = 0;

            function mudarSlide(direcao) {

                indice += direcao;

                if (indice >= imagens.length) {
                    indice = 0;
                }

                if (indice < 0) {
                    indice = imagens.length - 1;
                }

                document.getElementById("imagem-carrossel").src = imagens[indice];
            }

            // Carrossel automático

            setInterval(() => {
                mudarSlide(1);
            }, 4000);

        </script>
        <footer>
            <p>© 2026 Click Saúde - Todos os direitos reservados</p>
        </footer>

    </body>
</html>
