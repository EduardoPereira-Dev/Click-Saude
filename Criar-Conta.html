<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Saúde - Criar Conta</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background: #30895f;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .container{
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        h1{
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .input-box{
            margin-bottom: 20px;
        }

        .input-box label{
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .input-box input{
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        .input-box input:focus{
            border-color: #4facfe;
        }

        button{
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #4facfe;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover{
            background: #1d8df1;
        }

        .mensagem{
            margin-top: 20px;
            text-align: center;
            color: green;
            font-weight: bold;
        }

        .logo{
            margin-top: 20px;
            color: white;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 2px;
            padding: 20px;
        }

    </style>
</head>

<body>

    <div class="logo">
        CLICK SAÚDE
    </div>


    <div class="container">
        

        <h1>Criar Conta</h1>

        <form id="formCadastro">

            <div class="input-box">
                <label>Nome Completo</label>
                <input type="text" id="nome" required placeholder="Digite seu nome" required>
            </div>

            <div class="input-box">
                <label>Idade</label>
                <input type="number" id="idade" placeholder="Digite sua idade" required>
            </div>

            <div class="input-box">
                <label>Email</label>
                <input type="email" id="email" placeholder="Digite seu Email" required>
            </div>

            <div class="input-box">
                <label>Número do Celular</label>
                <input type="tel" id="celular" placeholder="Digite seu Numero para contato" required>
            </div>

            <button type="submit">
                Criar Conta
            </button>

            <div class="mensagem" id="mensagem"></div>

        </form>

    </div>

    <script>

        const form = document.getElementById("formCadastro");
        const mensagem = document.getElementById("mensagem");

        form.addEventListener("submit", function(event){

            event.preventDefault();

            // Pegando os dados
            const nome = document.getElementById("nome").value;
            const idade = document.getElementById("idade").value;
            const email = document.getElementById("email").value;
            const celular = document.getElementById("celular").value;

            // Criando objeto
            const usuario = {
                nome,
                idade,
                email,
                celular
            };

            // Salvando no navegador
            localStorage.setItem("usuario", JSON.stringify(usuario));

            mensagem.innerHTML = "Conta criada com sucesso!";

            // Limpar formulário
            form.reset();

        });

    </script>

</body>
</html>
