<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        *{
            margin:0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #30895f;
        }

        .login-box{
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .input-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            margin-bottom: 15px;
        }

        .input-box input:focus{
            border-color: #4facfe;
        }

        button{
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #4facfe;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover{
            background: red;
        }

        .link{
            text-align: center;
            margin-top: 20px;
        }

        .link a{
            text-decoration: none;
            color: #30895f;
        }

        .titulo{
            margin-top: 20px;
            color: white;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .logo{
            margin-top: 20px;
            color: white;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 2px;
            padding: 20px;
        }
    </style>
</head>

<body>
    <div class="logo">
        CLICK SAÚDE
    </div>

     <div class="login-box">
        <h2>Login</h2>

        <form>
            <div class="input-box">
                <input type="email" placeholder="Insira seu email" required>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Insira sua senha" required>
            </div>

            <button type="submit">
                Entrar
            </button>

            <div class="link"  onclick="window.location.href='Criar-Conta.html'">
                <a href="#">Criar Conta</a>
            </div>

        </form>
    </div>

    

</body>
</html>
